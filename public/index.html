<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Career Matching | Shortlist</title>
  <link rel="stylesheet" href="/css/dashboard.css">
  <script src="/js/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to shortlist</a>
  <header class="summary-strip">
    <div class="wrap summary-strip-inner">
      <span class="brand">Career Matching</span>
      <time id="run-date"></time>
    </div>
  </header>
  <main id="main" class="wrap">
    <div class="intro">
      <h1>Your shortlist</h1>
      <p id="board-description">Roles to consider, with evidence and conditions.</p>
    </div>
    <p id="status" role="status">Loading the shortlist…</p>
    <div id="board" hidden>
      <section aria-labelledby="shortlist-heading">
        <div class="section-header">
          <h2 id="shortlist-heading">Matches</h2>
          <span id="main-count" class="count"></span>
        </div>
        <p id="no-matches" hidden>No confirmed matches in this run. Check the search coverage below.</p>
        <ol id="matches" class="roles"></ol>
      </section>
      <section id="appendix-section" aria-labelledby="appendix-heading" hidden>
        <div class="section-header">
          <h2 id="appendix-heading">Appendix</h2>
          <span id="appendix-count" class="count"></span>
        </div>
        <ul id="appendix" class="roles"></ul>
      </section>
      <section aria-labelledby="coverage-heading" class="coverage">
        <div class="section-header"><h2 id="coverage-heading">Search coverage</h2></div>
        <dl id="coverage"></dl>
      </section>
    </div>
  </main>
</body>
</html>
