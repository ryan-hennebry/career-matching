<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 116" role="img" aria-labelledby="title desc">
<title id="title">Career Matching workflow</title>
<desc id="desc">Create a profile, verify sources, review evidence and produce a validated shortlist. Keep candidate decisions in local state.</desc>
<g font-family="Arial, sans-serif">
<rect x="14" y="16" width="174" height="72" rx="8" fill="#ffffff" stroke="#dad7d0"/>
<text x="28" y="44" fill="#1c1917" font-size="16" font-weight="650">Profile</text>
<text x="28" y="66" fill="#57534e" font-size="12">Goals and constraints</text><rect x="213" y="16" width="174" height="72" rx="8" fill="#ffffff" stroke="#dad7d0"/>
<text x="227" y="44" fill="#1c1917" font-size="16" font-weight="650">Source check</text>
<text x="227" y="66" fill="#57534e" font-size="12">Open role and first date</text><rect x="412" y="16" width="174" height="72" rx="8" fill="#ffffff" stroke="#dad7d0"/>
<text x="426" y="44" fill="#1c1917" font-size="16" font-weight="650">Review and rank</text>
<text x="426" y="66" fill="#57534e" font-size="12">Fit and evidence</text><rect x="611" y="16" width="174" height="72" rx="8" fill="#ffffff" stroke="#dad7d0"/>
<text x="625" y="44" fill="#1c1917" font-size="16" font-weight="650">Validated shortlist</text>
<text x="625" y="66" fill="#57534e" font-size="12">Tiers and next actions</text><path d="M 193 52 h 15 m -5 -5 5 5 -5 5" stroke="#57534e" fill="none"/><path d="M 392 52 h 15 m -5 -5 5 5 -5 5" stroke="#57534e" fill="none"/><path d="M 591 52 h 15 m -5 -5 5 5 -5 5" stroke="#57534e" fill="none"/>
<text x="14" y="109" fill="#57534e" font-size="12">Keep search history and candidate decisions on your computer.</text>
</g>
</svg>
